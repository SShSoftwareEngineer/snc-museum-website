name: Публікація на GitHub Pages

on:
  push:
    branches: [master]

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  check:
    name: Перевірка
    permissions:
      contents: read
    uses: ./.github/workflows/check.yml

  deploy:
    name: Публікація
    needs: check
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Завантажити код
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Зібрати папку сайту без службових файлів
        run: |
          mkdir _site
          cp ./*.html _site/
          cp -r css js partials assets _site/
          rm -rf _site/assets/img/originals _site/assets/img/unused

      - name: Налаштувати Pages
        uses: actions/configure-pages@v5

      - name: Запакувати сайт
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site

      - name: Опублікувати
        id: deployment
        uses: actions/deploy-pages@v4
