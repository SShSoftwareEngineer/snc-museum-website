name: Перевірка сайту

on:
  pull_request:
    branches: [master]
  workflow_call:

permissions:
  contents: read

jobs:
  check:
    name: Биті посилання та відсутні файли
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Завантажити код
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Перевірити посилання, зображення, стилі й шрифти
        run: python3 tools/check_site.py
